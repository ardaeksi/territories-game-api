spring.application.name=personnel-readiness-api

# Postgres (local dev via `docker run -d --name readiness-postgres -e POSTGRES_DB=readinessdb
# -e POSTGRES_USER=readiness -e POSTGRES_PASSWORD=readiness_dev_only -p 5432:5432 postgres:16`).
# Switched from H2 for the game branch: game state must survive a backend restart.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/readinessdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:readiness}
spring.datasource.password=${DB_PASSWORD:readiness_dev_only}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# TLS keystore: generate your own local dev keystore (see README) - never commit a real .p12.
# Both fallback values below are well-known dev-only placeholders, NOT real secrets.
# Real deployments MUST override SSL_KEYSTORE_PASSWORD and APP_ENCRYPTION_KEY via environment variables.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:dev-only-changeme}
server.ssl.key-alias=readiness

app.encryption.secret-key=${APP_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
